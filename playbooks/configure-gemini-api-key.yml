# Playbook for configuring Gemini API key to the managed nodes
#
# Copyright 2026 林博仁(Buo-ren Lin) <buo.ren.lin@gmail.com>
# SPDX-License-Identifier: CC-BY-SA-4.0+
- name: Configure Gemini API key for Gemini related products
  hosts: all
  environment: {}
    # Set these environment variables if you need to access the
    # internet via an HTTP/HTTPS proxy service
    #http_proxy: http://192.168.49.1:8228
    #https_proxy: http://192.168.49.1:8228
  tasks:
    - name: >-
        Import corresponding task list from the brlin_os_customizations
        role
      ansible.builtin.import_role:
        name: brlin.brlin_os_customizations
        tasks_from: configure-gemini-api-key.yml
