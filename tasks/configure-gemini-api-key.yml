- name: Ensure the .profile.d configuration drop-in directory exists.
  when: gemini_api_key is defined
  ansible.builtin.file:
    path: '{{ _profile_d_dir }}'
    state: directory
    owner: '{{ ansible_facts["user_id"] }}'
    group: '{{ ansible_facts["user_id"] }}'
    mode: '0755'

- name: Deploy companion .profile.d scriptlet from template.
  when: gemini_api_key is defined
  ansible.builtin.template:
    src: '{{ role_path }}/templates/dot-profile.d/10-configure-gemini-api-key.source.sh.j2'
    dest: '{{ _profile_d_dir }}/10-configure-gemini-api-key.source.sh'
    mode: '0600'
